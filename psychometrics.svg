<svg class="psychometrics" viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pmTitle pmDesc"><title id="pmTitle">People analytics and psychometrics</title><desc id="pmDesc">Three simple figures stand on a baseline. Points of light lift away from each figure, travel along curved paths to the right, and settle into a normal distribution, which brightens as each point arrives. The cycle repeats.</desc><defs><radialGradient id="bg-pm" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#1a2029"/><stop offset="100%" stop-color="#0e1217"/></radialGradient></defs><rect width="1100" height="360" fill="url(#bg-pm)"/>
<line class="pm-base" x1="60" y1="300" x2="1040" y2="300" stroke="#c9a86a" stroke-opacity="0.14" stroke-width="1"/>
<g class="pm-people" fill="none" stroke="#c9a86a" stroke-width="2.2" stroke-linecap="round">
  <g class="pm-person p1"><circle cx="205" cy="212" r="17"/><path d="M 175 300 C 175 252, 235 252, 235 300"/></g>
  <g class="pm-person p2"><circle cx="320" cy="216" r="17"/><path d="M 290 300 C 290 256, 350 256, 350 300"/></g>
  <g class="pm-person p3"><circle cx="435" cy="212" r="17"/><path d="M 405 300 C 405 252, 465 252, 465 300"/></g>
</g>
<g class="pm-paths" fill="none" stroke="#c9a86a" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 6">
  <path d="M 205 232 C 330 300, 470 300, 585 248"/><path d="M 320 236 C 420 290, 500 288, 592 254"/><path d="M 435 232 C 500 270, 545 272, 600 258"/>
</g>
<path class="pm-curve" pathLength="1" d="M 600 300 C 700 300, 720 120, 800 120 C 880 120, 900 300, 1000 300" fill="none" stroke="#c9a86a" stroke-width="2.4" stroke-linecap="round"/>
<line class="pm-axis" x1="600" y1="300" x2="1000" y2="300" stroke="#c9a86a" stroke-opacity="0.3" stroke-width="1"/>
<g class="pm-ticks" stroke="#c9a86a" stroke-opacity="0.3" stroke-width="1">
  <line x1="680" y1="295" x2="680" y2="305"/><line x1="740" y1="295" x2="740" y2="305"/><line x1="800" y1="293" x2="800" y2="307"/><line x1="860" y1="295" x2="860" y2="305"/><line x1="920" y1="295" x2="920" y2="305"/>
</g>
<circle class="pm-peak" cx="800" cy="120" r="6" fill="#e0c187"/>
<g class="pm-dots" fill="#e0c187"><circle class="pm-dot d1" r="5" opacity="0"><animateMotion dur="3.4s" begin="1.4s" repeatCount="indefinite" path="M 205 232 C 330 300, 470 300, 585 248" fill="freeze"/><animate attributeName="opacity" dur="3.4s" begin="1.4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.08;0.78;0.9;1"/></circle><circle class="pm-dot d2" r="5" opacity="0"><animateMotion dur="3.4s" begin="2.0s" repeatCount="indefinite" path="M 320 236 C 420 290, 500 288, 592 254" fill="freeze"/><animate attributeName="opacity" dur="3.4s" begin="2.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.08;0.78;0.9;1"/></circle><circle class="pm-dot d3" r="5" opacity="0"><animateMotion dur="3.4s" begin="2.6s" repeatCount="indefinite" path="M 435 232 C 500 270, 545 272, 600 258" fill="freeze"/><animate attributeName="opacity" dur="3.4s" begin="2.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.08;0.78;0.9;1"/></circle></g>
</svg>